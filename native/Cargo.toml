[package]
name = "claude-native-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "2"
rustix = { version = "1", features = ["fs", "time"] }
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
opt-level = 3
